name: Unity tests

# EditMode and PlayMode tests of the Unity project, run with GameCI (https://game.ci). They need a Unity licence, which only the
# repository owner can provide: until the UNITY_LICENSE (or UNITY_SERIAL) secret exists this workflow is SKIPPED, never failed.
# One-time setup, secrets and local equivalents: docs/TESTING.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write # GameCI publishes the results as a check run

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    name: Unity licence available
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      # Secrets cannot be read in a job-level "if", so the check is a step whose output the next job consumes.
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity tests skipped::No UNITY_LICENSE or UNITY_SERIAL secret is set (see docs/TESTING.md)."
          fi

  tests:
    name: Unity ${{ matrix.testMode }}
    needs: license
    if: needs.license.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache the Unity Library folder
        uses: actions/cache@v4
        with:
          path: SpheerURP/Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('SpheerURP/Assets/**', 'SpheerURP/Packages/**', 'SpheerURP/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - name: Run Unity ${{ matrix.testMode }} tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: SpheerURP
          # Keep in sync with SpheerURP/ProjectSettings/ProjectVersion.txt and an existing unityci/editor image tag.
          unityVersion: 6000.4.0f1
          testMode: ${{ matrix.testMode }}
          # Code coverage is not used and has crashed PlayMode runs on Unity 6.
          coverageEnabled: false
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.testMode }} results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.testMode }}-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: ignore
